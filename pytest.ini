[pytest]
testpaths = tests
; Integration tests are excluded by default so a green run never implies that
; live inference happened. Override with: pytest -m ollama  /  pytest -m openai
addopts = -ra --strict-markers -m "not integration"
markers =
    integration: hits a real LLM runtime; skipped unless that runtime is reachable
    ollama: requires a local Ollama server with the configured model pulled
    openai: requires LLM_API_KEY and network access to an OpenAI-compatible endpoint
filterwarnings =
    error::DeprecationWarning:app.*
