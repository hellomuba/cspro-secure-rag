# Defaults for the optional console in ui/. Applied automatically when
# `streamlit run ui/app.py` is started from the repository root.

[server]
# Loopback only. Streamlit's default binds every interface, which would put a
# console holding tenant API keys on the LAN -- and, behind a router that
# forwards the port, on the public internet. This is a local developer tool.
address = "127.0.0.1"
port = 8501
headless = true

# If the browser reports "Cannot connect to Streamlit (HTTP status: 403)" while
# `curl http://127.0.0.1:8501` returns 200, the websocket handshake is being
# rejected or rewritten between the browser and the server -- typically an
# editor's forwarded-port proxy, or a stale tab from an earlier instance.
#
# First try a real external browser at http://localhost:8501 and a hard refresh.
# Only if that fails, uncomment these two lines:
#
#   enableXsrfProtection = false
#   enableCORS = false
#
# That is acceptable *only* because `address` above restricts the server to
# loopback, so there is no cross-origin attacker to defend against. Do not
# combine it with a non-loopback address.

[browser]
# No telemetry. This is a security assessment on a managed corporate machine;
# usage statistics should not leave it.
gatherUsageStats = false

[client]
# Show errors in the console rather than leaking tracebacks into the browser.
showErrorDetails = false
